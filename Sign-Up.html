<body>

    <div class="Sign-In">
        <div class="Paragraph2">
        <p>Let's Do This</p>
        </div>
        <form action="example.com/path" method="post">
            
            <p class = "first_name">
            <label for="first_name">First Name:</label><br>
            <input type="text" id="first_name" placeholder="First Name">
            </p>

            <p class = "last_name">
            <label for="last_name">Last Name:</label><br>
            <input type="text" id="last_name" placeholder="Last Name">
            </p>
            
            <p class = "Email">
            <label for="Email">Email:</label><br>
            <input type="text" id="Email" placeholder="you@Email.com"><br>
            </p>

            <p class = "phone_number">
            <label for="phone_number">Phone Number:</label><br>
            <input type="tel" id="phone_number" placeholder="999-999-9999" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" required><br>
            </p>

            <p class = "Password">
            <label for="Password">Password:</label><br>
            <input type="password" id="Password" placeholder="Password" required>
            </p>

            <p class = "confirm_password">
            <label for="confirm_password">Confirm Password:</label><br>
            <input type="text" id="confirm_password" placeholder="Confirm Password" required>
            </p>
            
            
        </form>

    </div>
    
    <button type="submit" class="button">Create Account</button>
    <p class="Log_In">Already have an account? <a href="Sign_Up.html">Log In</a></p>
